<!--
  Cinemetrics — index.html
  Purpose: Single-page app entry HTML. Loads styles and the client bundle.
  Notes: Contains a modal used by trailer embeds AND the Cinemetrics intro teaser MP4.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemetrics — Movies, TV &amp; Games Discovery</title>
    <meta
      name="description"
      content="Track trending movies, TV shows, and games, see what's playing near you, and join the conversation with live fan comments and Hot Takes — all powered by real-time data."
    />
    <link rel="canonical" href="https://capstonesavvycoders.netlify.app/" />

    <!-- Open Graph (Facebook, Discord, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cinemetrics" />
    <meta property="og:title" content="Cinemetrics — Movies, TV &amp; Games Discovery" />
    <meta
      property="og:description"
      content="Track trending movies, TV shows, and games, see what's playing near you, and join the conversation with live fan comments and Hot Takes."
    />
    <meta property="og:url" content="https://capstonesavvycoders.netlify.app/" />
    <meta property="og:image" content="https://capstonesavvycoders.netlify.app/social-card.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cinemetrics — Movies, TV &amp; Games Discovery" />
    <meta
      name="twitter:description"
      content="Track trending movies, TV shows, and games, see what's playing near you, and join the conversation with live fan comments and Hot Takes."
    />
    <meta name="twitter:image" content="https://capstonesavvycoders.netlify.app/social-card.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,600;0,800;1,700;1,800;1,900&display=swap"
    />

    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0908'/%3E%3Cpath d='M30 35h40v30H30z' fill='none' stroke='%23ffd700' stroke-width='6'/%3E%3Cpath d='M38 35l6-10h8l-6 10zM56 35l6-10h8l-6 10z' fill='%23ffd700'/%3E%3Cpath d='M42 48l16 9-16 9z' fill='%23ffd700'/%3E%3C/svg%3E"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- Reusable modal for BOTH: intro MP4 (video) + trailers (iframe) -->
    <div id="trailerModal" class="trailer-modal hidden">
      <div class="trailer-content" role="dialog" aria-modal="true" aria-label="Video modal">
        <button class="close-modal" type="button" aria-label="Close video">&times;</button>

        <!-- Intro MP4 (teaser) -->
        <video
          id="introVideo"
          class="hidden"
          controls
          preload="metadata"
          playsinline
        ></video>

        <!-- Trailer embed (YouTube / etc.) -->
        <iframe
          id="trailerFrame"
          class="hidden"
          width="900"
          height="500"
          frameborder="0"
          allow="autoplay; encrypted-media"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
